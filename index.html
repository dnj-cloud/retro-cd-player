<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RETRO CD</title>
<meta name="description" content="An offline CD-shelf music player inspired by 2008-2012 electronics.">
<meta name="theme-color" content="#0b0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head><body>
<div id="app">
 <div class="bar"><input id="q" type="text" placeholder="Search artist, album or track" aria-label="Search"><button class="k" id="imp" data-i="imp">+ Import</button><button class="k" id="set" data-i="snd">Sound</button><button class="k" id="scn" data-i="scan" style="display:none">Scan</button><button class="k" id="lng">ع</button></div>
 <div class="tabs"><button class="k on" data-t="all" data-i="t_all">All albums</button><button class="k" data-t="art" data-i="t_art">Artists</button><button class="k" data-t="dl" data-i="t_dl">Downloaded</button><button class="k" data-t="rec" data-i="t_rec">Recent</button></div>
 <div class="player" id="pl">
  <div class="bay open" id="bay"><div class="disc" id="disc"></div><div class="lid"></div></div>
  <div class="right">
   <div class="lcd"><div id="l1">NO DISC</div><div id="l2">Drag a CD here</div><div id="l3">TRK --/-- 00:00</div><div class="pg"><i id="pgi"></i></div></div>
   <div class="ctl"><button class="k" id="bp" aria-label="Previous">&#9664;&#9664;</button><button class="k" id="bt" aria-label="Play or pause">&#9654;</button><button class="k" id="bn" aria-label="Next">&#9654;&#9654;</button><button class="k" id="bs" aria-label="Stop">&#9632;</button><button class="k" id="be" data-i="eject" aria-label="Eject" style="grid-column:span 2">&#9650; Eject</button></div>
  </div>
 </div>
 <div class="panel" id="panel"><div class="pi"><small>Tap a CD to see its details. Pull it upward and drop it on the player to insert it.</small></div></div>
 <div class="shelf" id="shelf"></div>
</div>
<div id="dlg"><div class="box" id="dbox"></div></div><div id="toast"></div>
<audio id="au" preload="auto"></audio>
<noscript>RETRO CD needs JavaScript.</noscript>
<script src="app.js"></script>
<script src="fixes.js"></script>
<script src="fix3.js"></script>
<script src="fix4.js"></script>
<script src="fix5.js"></script>
</body></html>
